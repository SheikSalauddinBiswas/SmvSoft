<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SMV Item Picker</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --bg:#eef2f6;--glow:#cdeee9;--surface:#ffffff;--text:#14202b;--muted:#64748b;--line:#e1e8ef;
  --accent:#0f766e;--accent2:#155e75;--accent-soft:#d9f3ee;--accent-text:#0b4a45;--on-accent:#ffffff;--danger:#c2410c;
  --shadow:0 1px 2px rgba(20,32,43,.06),0 8px 24px rgba(20,32,43,.07);
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0c1317;--glow:#10343a;--surface:#141f25;--text:#e6eef2;--muted:#8fa3ad;--line:#243540;
    --accent:#2dd4bf;--accent2:#22a6c4;--accent-soft:#12383a;--accent-text:#bdf3ea;--on-accent:#062a27;--danger:#fb923c;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0c1317;--glow:#10343a;--surface:#141f25;--text:#e6eef2;--muted:#8fa3ad;--line:#243540;
  --accent:#2dd4bf;--accent2:#22a6c4;--accent-soft:#12383a;--accent-text:#bdf3ea;--on-accent:#062a27;--danger:#fb923c;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;color:var(--text);font-family:"Hind Siliguri","Noto Sans Bengali","Segoe UI",system-ui,-apple-system,sans-serif;line-height:1.45;
  background:radial-gradient(900px 380px at 12% -8%,var(--glow),transparent 70%),var(--bg);background-attachment:fixed;transition:background-color .35s,color .35s}
main{max-width:760px;margin:0 auto;padding:16px 16px 210px}
.hero{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:20px 18px;border-radius:20px;color:#fff;
  background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:var(--shadow);animation:rise .5s ease both}
.hero h1{margin:0;font-size:1.5rem;line-height:1.2}
.hero p{margin:4px 0 0;font-size:.85rem;opacity:.85}
.tools{display:flex;gap:8px;flex-shrink:0}
.tool{font:inherit;font-size:.9rem;min-width:40px;height:38px;padding:0 12px;background:rgba(255,255,255,.18);color:#fff;border:1px solid rgba(255,255,255,.35);border-radius:19px;cursor:pointer;transition:transform .15s,background .2s}
.tool:hover{background:rgba(255,255,255,.3)}
.tool:active{transform:scale(.92)}
#theme.spin span{display:inline-block;animation:spin .5s ease}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);transition:background-color .35s,border-color .35s}
.acc{margin-top:16px;overflow:hidden;animation:rise .5s .08s ease both}
.acc-h{width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;font:inherit;font-weight:700;color:var(--text);background:none;border:0;padding:15px 16px;cursor:pointer}
.acc-h .plus{display:inline-grid;place-items:center;width:26px;height:26px;margin-right:10px;border-radius:50%;background:var(--accent-soft);color:var(--accent-text);font-weight:800}
.chev{color:var(--muted);transition:transform .3s ease}
.acc.open .chev{transform:rotate(180deg)}
.acc-body{display:grid;grid-template-rows:0fr;visibility:hidden;transition:grid-template-rows .3s ease,visibility 0s .3s}
.acc.open .acc-body{grid-template-rows:1fr;visibility:visible;transition:grid-template-rows .3s ease,visibility 0s}
.acc-in{overflow:hidden;min-height:0}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:4px 16px 16px}
form .full{grid-column:1/-1}
label{display:block;font-size:.8rem;color:var(--muted);margin-bottom:5px;font-weight:600}
input{width:100%;font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px 12px;transition:border-color .2s,box-shadow .2s,background-color .35s}
input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);outline:none}
button:focus-visible,.card:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.add{grid-column:1/-1;font:inherit;font-weight:700;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border:0;border-radius:10px;padding:12px;cursor:pointer;transition:transform .12s,filter .2s}
:root[data-theme="dark"] .add{color:var(--on-accent)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .add{color:var(--on-accent)}}
.add:hover{filter:brightness(1.08)}
.add:active{transform:scale(.97)}
.sec{display:flex;align-items:baseline;justify-content:space-between;margin:26px 4px 10px}
.sec h2{margin:0;font-size:1.1rem}
.sec span{font-size:.85rem;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:12px}
.card{position:relative;text-align:left;color:var(--text);background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:14px 12px 32px;cursor:pointer;box-shadow:var(--shadow);
  transition:background-color .25s,border-color .25s,transform .15s,box-shadow .25s,color .25s}
.card:hover{transform:translateY(-3px)}
.card:active{transform:scale(.96)}
.card.sel{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-text);box-shadow:0 6px 20px color-mix(in srgb,var(--accent) 30%,transparent)}
.card.new{animation:pop .45s cubic-bezier(.2,1.4,.4,1)}
.card.out{animation:out .25s ease forwards}
.card .n{font-weight:600;word-break:break-word;padding-right:24px}
.card .v{font-size:1.7rem;font-weight:800;margin-top:6px;letter-spacing:-.5px}
.tick{position:absolute;top:11px;right:11px;width:20px;height:20px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:.7rem;color:transparent;
  transition:background-color .2s,border-color .2s,transform .25s cubic-bezier(.2,1.6,.4,1),color .2s}
.card.sel .tick{background:var(--accent);border-color:var(--accent);color:var(--on-accent);transform:scale(1.15)}
.del{position:absolute;bottom:4px;right:6px;background:none;border:0;color:var(--muted);font-size:1.2rem;cursor:pointer;padding:2px 8px;transition:color .2s,transform .15s}
.del:hover{color:var(--danger);transform:scale(1.2)}
.kebab{position:absolute;bottom:4px;right:4px;background:none;border:0;color:var(--muted);font-size:1.25rem;line-height:1;cursor:pointer;padding:4px 10px;border-radius:8px;transition:background-color .2s,color .2s}
.kebab:hover,.kebab[aria-expanded="true"]{background:var(--line);color:var(--text)}
.menu{position:fixed;z-index:50;min-width:150px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.22);padding:6px;display:none}
.menu.open{display:block;animation:fade .15s ease}
.menu button{display:block;width:100%;text-align:left;font:inherit;color:var(--text);background:none;border:0;border-radius:8px;padding:10px 12px;cursor:pointer}
.menu button:hover{background:var(--bg)}
.menu button.dng{color:var(--danger)}
.modal{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;padding:16px;background:rgba(10,18,22,.55)}
.modal.open{display:flex;animation:fade .2s ease}
.dlg{width:min(420px,100%);background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:0 20px 60px rgba(0,0,0,.35);padding:18px;display:grid;gap:12px}
.dlg h3{margin:0 0 2px;font-size:1.1rem}
.dlg .btns{display:flex;gap:8px;justify-content:flex-end;margin-top:4px}
.empty{color:var(--muted);text-align:center;padding:26px 8px;grid-column:1/-1}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.btn{font:inherit;background:var(--surface);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:9px 14px;cursor:pointer;white-space:nowrap;transition:transform .12s,opacity .2s,background-color .2s}
.btn:active{transform:scale(.95)}
.btn.pri{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border-color:transparent;font-weight:600}
:root[data-theme="dark"] .btn.pri{color:var(--on-accent)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.pri{color:var(--on-accent)}}
.btn:disabled{opacity:.4;cursor:not-allowed}
#hist{display:none}
#hist.open{display:block;animation:fade .4s ease}
.tw{overflow-x:auto;border-radius:16px}
table{width:100%;border-collapse:collapse;background:var(--surface)}
th,td{padding:11px 14px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:.8rem;color:var(--muted);background:var(--bg);font-weight:700}
tbody tr:last-child td{border-bottom:0}
td.avg{font-weight:700;color:var(--accent)}
td.act{text-align:right;width:1%}
tr.new{animation:slide .45s ease}
tr.out{animation:out .25s ease forwards}
.tw .del{position:static}
.foot{margin:24px 4px 0;font-size:.78rem;color:var(--muted);text-align:center}
.bar{position:fixed;left:0;right:0;bottom:0;padding:0 12px calc(12px + env(safe-area-inset-bottom,0px));pointer-events:none}
.bar .in{max-width:736px;margin:0 auto;pointer-events:auto;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:12px 14px;
  box-shadow:0 10px 40px rgba(0,0,0,.18);transition:background-color .35s,border-color .35s}
.bar .avg{font-size:1.45rem;font-weight:800;color:var(--accent);display:inline-block}
.bar .avg.bump{animation:bump .35s ease}
.bar .sub{font-size:.8rem;color:var(--muted)}
.row{display:flex;gap:8px;margin-top:10px;align-items:center}
.row input{flex:1;min-width:0;padding:9px 10px}
.msg{font-size:.8rem;color:var(--accent);min-height:1.1em;margin-top:4px}
.msg.show{animation:fade .4s ease}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:scale(1)}}
@keyframes slide{from{opacity:0;transform:translateX(-20px)}to{opacity:1;transform:none}}
@keyframes out{to{opacity:0;transform:scale(.85)}}
@keyframes bump{40%{transform:scale(1.18)}}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@keyframes spin{from{transform:rotate(-120deg) scale(.5)}to{transform:none}}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main>
  <header class="hero">
    <div><h1 data-t="title"></h1><p data-t="subtitle"></p></div>
    <div class="tools">
      <button class="tool" id="lang" type="button"></button>
      <button class="tool" id="theme" type="button"><span>☾</span></button>
    </div>
  </header>
  <section class="panel acc" id="acc">
    <button class="acc-h" id="accBtn" type="button" aria-expanded="false" aria-controls="accBody">
      <span><span class="plus">+</span><span data-t="addItem"></span></span><span class="chev">▾</span>
    </button>
    <div class="acc-body" id="accBody"><div class="acc-in">
  <form id="f" class="fgrid">
    <div class="full"><label for="name" data-t="itemName"></label><input id="name" required maxlength="40" autocomplete="off"></div>
    <div class="full"><label for="val" data-t="value"></label><input id="val" type="number" step="any" required inputmode="decimal"></div>
    <button class="add" type="submit" data-t="addItem"></button>
  </form>
    </div></div>
  </section>
  <div class="sec"><h2 data-t="items"></h2><span id="count"></span></div>
  <div id="grid" class="grid"></div>
  <div class="sec"><h2 data-t="saved"></h2></div>
  <div class="actions">
    <button class="btn" id="show" type="button" aria-expanded="false"></button>
    <button class="btn pri" id="export" type="button" data-t="exportData"></button>
  </div>
  <div id="hist"></div>
  <div class="foot" id="foot"></div>
</main>
<div class="bar"><div class="in">
  <div class="avg" id="avg">–</div>
  <div class="sub" id="sub"></div>
  <div class="row">
    <input id="sdate" type="date" aria-label="Date">
    <button class="btn" id="clr" type="button" data-t="cancel"></button>
    <button class="btn pri" id="save" type="button" data-t="save" disabled></button>
  </div>
  <div class="msg" id="msg"></div>
</div></div>
<div class="menu" id="menu" role="menu">
  <button type="button" id="m-edit" role="menuitem" data-t="mEdit"></button>
  <button type="button" id="m-del" class="dng" role="menuitem" data-t="mDel"></button>
</div>
<div class="modal" id="modal">
  <form class="dlg" id="ef">
    <h3 data-t="editTitle"></h3>
    <div><label for="ename" data-t="itemName"></label><input id="ename" required maxlength="40" autocomplete="off"></div>
    <div><label for="evalue" data-t="value"></label><input id="evalue" type="number" step="any" required inputmode="decimal"></div>
    <div class="btns">
      <button class="btn" id="ecancel" type="button" data-t="cancelDlg"></button>
      <button class="btn pri" type="submit" data-t="saveEdit"></button>
    </div>
  </form>
</div>
<script>
var TX={
 bn:{title:"আমার আইটেম",subtitle:"আইটেম সিলেক্ট করে Avg SMV বের করুন",itemName:"আইটেমের নাম",value:"ভ্যালু (SMV)",addItem:"আইটেম যোগ করুন",items:"আইটেম",saved:"সেভ করা ডাটা",
  cancel:"বাতিল",save:"সেভ করুন",none:"এখনও কোনো আইটেম নেই। উপরে প্রথম আইটেমটি যোগ করুন।",noRec:"এখনও কিছু সেভ করা হয়নি।",pick:"এভারেজ দেখতে কার্ড সিলেক্ট করুন",
  of:function(a,b){return b+" টির মধ্যে "+a+" টি সিলেক্ট করা হয়েছে"},del:"মুছুন",done:"সেভ হয়েছে",langBtn:"EN",showData:"শো ডাটা",hideData:"ডাটা লুকান",exportData:"এক্সপোর্ট ডাটা",
  nothing:"এক্সপোর্ট করার মতো সেভ করা ডাটা নেই।",noLib:"এক্সেল লাইব্রেরি লোড হয়নি, ইন্টারনেট দেখে আবার চেষ্টা করুন।",exported:"এক্সপোর্ট হয়েছে",saveErr:"সার্ভারে সেভ করা যায়নি।",
  stServer:"ডাটা সার্ভারের data ফোল্ডারে সেভ হচ্ছে",stLocal:"ডাটা শুধু এই ব্রাউজারে সেভ হচ্ছে",avgLbl:"এভারেজ",mEdit:"এডিট",mDel:"ডিলিট",editTitle:"আইটেম এডিট করুন",saveEdit:"সেভ করুন",cancelDlg:"বাতিল",menuLabel:"অপশন"},
 en:{title:"My items",subtitle:"Select items to get the Avg SMV",itemName:"Item name",value:"Value (SMV)",addItem:"Add item",items:"Items",saved:"Saved data",
  cancel:"Clear",save:"Save",none:"No items yet. Add your first one above.",noRec:"Nothing saved yet.",pick:"Select cards to see the average",
  of:function(a,b){return a+" of "+b+" selected"},del:"Delete",done:"Saved",langBtn:"বাং",showData:"Show data",hideData:"Hide data",exportData:"Export data",
  nothing:"No saved data to export.",noLib:"Excel library did not load. Check your connection and try again.",exported:"Exported",saveErr:"Could not save to the server.",
  stServer:"Data is saved in the server's data folder",stLocal:"Data is saved in this browser only",avgLbl:"Average",mEdit:"Edit",mDel:"Delete",editTitle:"Edit item",saveEdit:"Save",cancelDlg:"Cancel",menuLabel:"Options"}
};
var API="api/data",serverOK=false,lang="bn",items=[],records=[],selected={},newId=null,newRec=null;
function get(k){try{return localStorage.getItem(k)}catch(e){return null}}
function put(k,v){try{localStorage.setItem(k,v)}catch(e){}}
if(get("lang")==="en")lang="en";
function t(k){return TX[lang][k]}
var root=document.documentElement;
function curTheme(){var a=root.getAttribute("data-theme");if(a)return a;return window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"}
function setTheme(th){root.setAttribute("data-theme",th);document.querySelector("#theme span").textContent=th==="dark"?"☀":"☾";document.getElementById("theme").setAttribute("aria-label",th==="dark"?"Light mode":"Dark mode")}
var st=get("theme");if(st==="light"||st==="dark")root.setAttribute("data-theme",st);
setTheme(curTheme());
document.getElementById("theme").onclick=function(){
  var n=curTheme()==="dark"?"light":"dark";setTheme(n);put("theme",n);
  var b=this;b.classList.remove("spin");void b.offsetWidth;b.classList.add("spin");
};
function today(){var d=new Date();return d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2)}
var sdate=document.getElementById("sdate");sdate.value=today();
function fmt(n){return Number(n.toFixed(2)).toString()}
function selItems(){return items.filter(function(i){return selected[i.id]})}
function flash(txt){var m=document.getElementById("msg");m.textContent=txt;m.classList.remove("show");void m.offsetWidth;m.classList.add("show")}

/* ---- storage: data/data.json on the server, browser storage as fallback ---- */
function persist(){
  var body=JSON.stringify({items:items,records:records});
  if(serverOK){
    fetch(API,{method:"PUT",headers:{"Content-Type":"application/json"},body:body})
      .then(function(r){if(!r.ok)throw 0}).catch(function(){flash(t("saveErr"))});
  }else{put("smvdata",body)}
}
function loadAll(done){
  fetch(API,{cache:"no-store"}).then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(d){
    items=d.items||[];records=d.records||[];serverOK=true;
  }).catch(function(){
    try{var d=JSON.parse(get("smvdata"));if(d){items=d.items||[];records=d.records||[]}}catch(e){}
  }).then(done);
}

function applyLang(){
  root.lang=lang;document.title=t("title");
  document.querySelectorAll("[data-t]").forEach(function(el){el.textContent=t(el.getAttribute("data-t"))});
  document.getElementById("lang").textContent=t("langBtn");
  document.getElementById("foot").textContent=serverOK?t("stServer"):t("stLocal");
  document.getElementById("msg").textContent="";
  updateShow();renderItems();updateBar(false);renderHist();
}
function renderItems(){
  closeMenu();
  var grid=document.getElementById("grid");grid.innerHTML="";
  document.getElementById("count").textContent=items.length?String(items.length):"";
  if(!items.length){var e=document.createElement("div");e.className="empty";e.textContent=t("none");grid.appendChild(e)}
  items.forEach(function(it){
    var c=document.createElement("div");
    c.className="card"+(selected[it.id]?" sel":"")+(it.id===newId?" new":"");
    c.tabIndex=0;c.setAttribute("role","button");c.setAttribute("aria-pressed",!!selected[it.id]);
    var tk=document.createElement("div");tk.className="tick";tk.textContent="✓";c.appendChild(tk);
    var n=document.createElement("div");n.className="n";n.textContent=it.name;c.appendChild(n);
    var v=document.createElement("div");v.className="v";v.textContent=fmt(it.value);c.appendChild(v);
    c.dataset.id=String(it.id);
    var k=document.createElement("button");k.className="kebab";k.type="button";k.textContent="⋮";k.setAttribute("aria-label",t("menuLabel")+" "+it.name);k.setAttribute("aria-haspopup","menu");k.setAttribute("aria-expanded","false");
    k.onclick=function(ev){ev.stopPropagation();openMenu(k,it)};
    c.appendChild(k);
    function toggle(){
      if(selected[it.id])delete selected[it.id];else selected[it.id]=1;
      c.classList.toggle("sel",!!selected[it.id]);c.setAttribute("aria-pressed",!!selected[it.id]);updateBar(true);
    }
    c.onclick=toggle;
    c.onkeydown=function(ev){if(ev.target===c&&(ev.key==="Enter"||ev.key===" ")){ev.preventDefault();toggle()}};
    grid.appendChild(c);
  });
  newId=null;
}
var menu=document.getElementById("menu"),menuBtn=null,menuItem=null;
function closeMenu(){menu.classList.remove("open");if(menuBtn)menuBtn.setAttribute("aria-expanded","false");menuBtn=null;menuItem=null}
function openMenu(btn,it){
  if(menuBtn===btn){closeMenu();return}
  closeMenu();menuBtn=btn;menuItem=it;btn.setAttribute("aria-expanded","true");
  menu.classList.add("open");
  var r=btn.getBoundingClientRect(),mh=menu.offsetHeight,mw=menu.offsetWidth;
  var top=r.bottom+4;if(top+mh>window.innerHeight-170)top=r.top-mh-4;
  menu.style.top=Math.max(8,top)+"px";
  menu.style.left=Math.min(Math.max(8,r.right-mw),window.innerWidth-mw-8)+"px";
}
function deleteItem(it){
  var c=document.querySelector('.card[data-id="'+String(it.id)+'"]');if(c)c.classList.add("out");
  setTimeout(function(){items=items.filter(function(i){return i.id!==it.id});delete selected[it.id];persist();renderItems();updateBar(true)},230);
}
var modal=document.getElementById("modal"),editItem=null;
function openEdit(it){editItem=it;document.getElementById("ename").value=it.name;document.getElementById("evalue").value=it.value;modal.classList.add("open");setTimeout(function(){document.getElementById("ename").focus()},30)}
function closeEdit(){modal.classList.remove("open");editItem=null}
document.getElementById("ef").onsubmit=function(e){
  e.preventDefault();if(!editItem)return;
  var n=document.getElementById("ename").value.trim(),v=parseFloat(document.getElementById("evalue").value);
  if(!n||isNaN(v))return;
  editItem.name=n;editItem.value=v;persist();closeEdit();renderItems();updateBar(true);
};
document.getElementById("ecancel").onclick=closeEdit;
modal.onclick=function(e){if(e.target===modal)closeEdit()};
document.getElementById("m-edit").onclick=function(){var it=menuItem;closeMenu();if(it)openEdit(it)};
document.getElementById("m-del").onclick=function(){var it=menuItem;closeMenu();if(it)deleteItem(it)};
document.addEventListener("click",function(e){if(!menu.contains(e.target))closeMenu()});
document.addEventListener("keydown",function(e){if(e.key==="Escape"){closeMenu();closeEdit()}});
window.addEventListener("resize",closeMenu);window.addEventListener("scroll",closeMenu,true);
function updateBar(animate){
  var sel=selItems(),avg=document.getElementById("avg"),sub=document.getElementById("sub"),btn=document.getElementById("save");
  if(sel.length){
    var sum=sel.reduce(function(a,i){return a+i.value},0);
    avg.textContent="Avg SMV: "+(sum/sel.length).toFixed(2);sub.textContent=t("of")(sel.length,items.length);btn.disabled=false;
  }else{avg.textContent="–";sub.textContent=t("pick");btn.disabled=true}
  if(animate){avg.classList.remove("bump");void avg.offsetWidth;avg.classList.add("bump")}
}
function sortedRecs(){return records.slice().sort(function(a,b){return a.date<b.date?-1:a.date>b.date?1:a.id-b.id})}
function renderHist(){
  var h=document.getElementById("hist");h.innerHTML="";
  if(!records.length){var e=document.createElement("div");e.className="empty panel";e.textContent=t("noRec");h.appendChild(e);return}
  var wrap=document.createElement("div");wrap.className="tw panel";
  var tb=document.createElement("table");
  tb.innerHTML="<thead><tr><th>No</th><th>Date</th><th>Avg SMV</th><th></th></tr></thead>";
  var body=document.createElement("tbody");
  sortedRecs().forEach(function(rc,i){
    var tr=document.createElement("tr");if(rc.id===newRec)tr.className="new";
    tr.title=rc.items.map(function(x){return x.name+" ("+fmt(x.value)+")"}).join(", ");
    [String(i+1),rc.date,Number(rc.avg).toFixed(2)].forEach(function(txt,k){var td=document.createElement("td");if(k===2)td.className="avg";td.textContent=txt;tr.appendChild(td)});
    var ta=document.createElement("td");ta.className="act";
    var x=document.createElement("button");x.className="del";x.type="button";x.textContent="×";x.setAttribute("aria-label",t("del"));
    x.onclick=function(){tr.classList.add("out");setTimeout(function(){records=records.filter(function(q){return q.id!==rc.id});persist();renderHist()},230)};
    ta.appendChild(x);tr.appendChild(ta);body.appendChild(tr);
  });
  tb.appendChild(body);wrap.appendChild(tb);h.appendChild(wrap);newRec=null;
}
function updateShow(){var o=document.getElementById("hist").classList.contains("open");var b=document.getElementById("show");b.textContent=o?t("hideData"):t("showData");b.setAttribute("aria-expanded",o)}
document.getElementById("show").onclick=function(){document.getElementById("hist").classList.toggle("open");updateShow()};
document.getElementById("lang").onclick=function(){lang=lang==="bn"?"en":"bn";put("lang",lang);applyLang()};
document.getElementById("f").onsubmit=function(e){
  e.preventDefault();
  var name=document.getElementById("name"),val=document.getElementById("val");
  var it={id:Date.now()+Math.random(),name:name.value.trim(),value:parseFloat(val.value)};
  items.push(it);newId=it.id;persist();
  name.value="";val.value="";name.focus();renderItems();updateBar(false);
};
document.getElementById("clr").onclick=function(){selected={};document.getElementById("msg").textContent="";renderItems();updateBar(true)};
document.getElementById("save").onclick=function(){
  var sel=selItems();if(!sel.length)return;
  var sum=sel.reduce(function(a,i){return a+i.value},0),dt=sdate.value||today();
  var rc={id:Date.now(),date:dt,avg:sum/sel.length,items:sel.map(function(i){return{name:i.name,value:i.value}})};
  records.push(rc);newRec=rc.id;persist();selected={};
  flash(t("done")+" ("+dt+")");
  renderItems();updateBar(true);renderHist();
};
document.getElementById("export").onclick=function(){
  if(!records.length){flash(t("nothing"));return}
  if(!window.XLSX){flash(t("noLib"));return}
  var aoa=[["No","Date","Avg SMV","Style Details"]];
  sortedRecs().forEach(function(r,i){
    var p=r.date.split("-");
    var serial=Math.round((Date.UTC(+p[0],+p[1]-1,+p[2])-Date.UTC(1899,11,30))/86400000);
    aoa.push([i+1,serial,Number(r.avg.toFixed(2)),(r.items||[]).map(function(x){return x.name+" ("+fmt(x.value)+")"}).join(", ")]);
  });
  var ws=XLSX.utils.aoa_to_sheet(aoa);
  for(var i=2;i<=aoa.length;i++){ws["B"+i].z="yyyy-mm-dd";ws["C"+i].z="0.00"}
  ws["!cols"]=[{wch:8},{wch:14},{wch:12},{wch:70}];
  ws["!autofilter"]={ref:"A1:D"+aoa.length};
  var wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,"Avg SMV");
  try{XLSX.writeFile(wb,"avg-smv.xlsx");flash(t("exported"))}catch(err){flash(t("noLib"))}
};
var acc=document.getElementById("acc");
function setAcc(o,focus){
  acc.classList.toggle("open",o);document.getElementById("accBtn").setAttribute("aria-expanded",o);
  if(o&&focus)setTimeout(function(){document.getElementById("name").focus()},320);
}
document.getElementById("accBtn").onclick=function(){setAcc(!acc.classList.contains("open"),true)};
loadAll(function(){if(!items.length)setAcc(true,false);applyLang()});
</script>
</body>
</html>
